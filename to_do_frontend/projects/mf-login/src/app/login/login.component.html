<div class="auth-shell">
  <section class="panel-left">
    <div class="copy-wrap">
      <div class="brand">di<span class="dot">:</span>sh</div>
      <h1>Welcome to your SBB Management Portal</h1>
      <p class="lede">
        Manage and monitor millions of KPIs intelligently to improve operational efficiency and enhance customer experience
      </p>
      <div class="meta">
        <a href="#">Privacy policy</a>
        <span class="sep">•</span>
        <a href="#">Terms of use</a>
        <span class="sep">•</span>
        <a href="#">Contact support</a>
      </div>
    </div>
  </section>

  <section class="panel-right">
    <div class="auth-card mat-elevation-z8">
      <h2 class="card-title">Login</h2>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" required aria-label="Email" placeholder="you@company.com">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" required aria-label="Password">
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide" aria-label="Toggle password visibility">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="row aux">
          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button mat-flat-button color="primary" class="btn-primary w-100" type="submit">Login</button>
      </form>
    </div>
  </section>
</div>
