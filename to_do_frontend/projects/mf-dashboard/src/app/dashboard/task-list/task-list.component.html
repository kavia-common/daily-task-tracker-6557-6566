<div class="toolbar-row">
  <button mat-flat-button color="primary" class="btn-primary" (click)="addTask()">
    <mat-icon>add</mat-icon>
    <span>Add Task</span>
  </button>
  <span class="spacer"></span>
  <button mat-stroked-button (click)="loadTasks()">
    <mat-icon>refresh</mat-icon>
    <span>Refresh</span>
  </button>
</div>

<mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

<div *ngIf="errorMsg()" class="error-area" role="alert" aria-live="assertive">
  {{ errorMsg() }}
</div>

<table mat-table [dataSource]="tasks()" class="mat-elevation-z1 task-table">
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let t" [class.selected]="selectedId() === t.id" (click)="selectRow(t)">
      <div class="title">{{ t.title }}</div>
      <div class="desc" *ngIf="t.description">{{ t.description }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let t">
      <span class="status" [attr.data-status]="t.status">{{ t.status }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>Due</th>
    <td mat-cell *matCellDef="let t">{{ t.dueDate ? (t.dueDate | date:'mediumDate') : '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let t">
      <button mat-icon-button (click)="editTask(t)" aria-label="Edit task">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="deleteTask(t)" aria-label="Delete task">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
